services:
  - type: web
    name: tennis-intelligence
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: Connector__ApiKey
        sync: false
      - key: AppAuth__Password
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
